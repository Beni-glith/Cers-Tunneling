<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220">
  <style>
    .box { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; rx: 10; ry: 10; }
    .text { fill: #e2e8f0; font-family: 'Segoe UI', sans-serif; font-size: 14px; }
    .arrow { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
  </defs>
  <rect class="box" x="20" y="40" width="160" height="60" />
  <text class="text" x="100" y="75" text-anchor="middle">One-line install</text>
  <rect class="box" x="200" y="20" width="140" height="60" />
  <text class="text" x="270" y="55" text-anchor="middle">GitHub bundle</text>
  <rect class="box" x="200" y="110" width="140" height="60" />
  <text class="text" x="270" y="145" text-anchor="middle">IP allowlist</text>
  <rect class="box" x="360" y="60" width="140" height="80" />
  <text class="text" x="430" y="95" text-anchor="middle">tunnelctl</text>
  <text class="text" x="430" y="115" text-anchor="middle">Xray + proxies</text>
  <line class="arrow" x1="180" y1="70" x2="200" y2="50" />
  <line class="arrow" x1="180" y1="70" x2="200" y2="140" />
  <line class="arrow" x1="340" y1="50" x2="360" y2="90" />
  <line class="arrow" x1="340" y1="140" x2="360" y2="120" />
</svg>
